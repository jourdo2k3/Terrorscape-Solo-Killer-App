function useBlob(blob){ return new Promise(res=>{
  const url = URL.createObjectURL(blob); const img = new Image();
  img.onload = ()=>{ if(BOARD.url) URL.revokeObjectURL(BOARD.url); BOARD.url=url; BOARD.img=img; BOARD.w=img.naturalWidth; BOARD.h=img.naturalHeight; img.alt='Board'; img.draggable=false; res(true); };
  img.onerror = ()=>{ URL.revokeObjectURL(url); res(false); };
  img.src = url; }); }
function applyStream(){ if(typeof document!=='undefined' && document.body && document.body.classList) document.body.classList.toggle('stream', BOARD.stream); }
async function setBoardMap(id){
  BOARD.mapId = id; BOARD.calib = null; loadCal(); dropImg();
  try{ const b = await idbGet(id); if(b && BOARD.mapId===id) await useBlob(b); }catch(e){}
  render();
}
async function boardInit(){
  BOARD.mapId = MAP.id; boardPrefsLoad();
  try{ const b = await idbGet(MAP.id); if(b) await useBlob(b); }catch(e){}
  applyStream(); render();
}
async function loadBoardFile(file){
  if(!file) return;
  const ok = await useBlob(file); if(!ok) return render();
  try{ await idbPut(BOARD.mapId, file); }catch(e){}
  if(!BOARD.showSetup){ BOARD.view = 'board'; if(!calComplete()) return startCalib('rooms'); }
  boardPrefsSave(); render();
}
async function removeBoard(){
  try{ await idbDel(BOARD.mapId); }catch(e){}
  dropImg(); if(!BOARD.showSetup) BOARD.view='schematic'; BOARD.calib=null; boardPrefsSave(); render();
}
function placeBoardImg(){ if(typeof document==='undefined') return; const ph=document.getElementById('bimg'); if(ph && ph.replaceWith && BOARD.img) ph.replaceWith(BOARD.img); }

// ---- positions ----
const userCalOK = () => !!(BOARD.cal && BOARD.cal.rooms && mRooms().every(l=>BOARD.cal.rooms[l]));
function presetFor(){
  const p = BOARD_PRESETS[BOARD.mapId]; if(!p || !BOARD.w || !BOARD.h) return null;
  const aspect = p.w && p.h ? p.w/p.h : 2400/1473;
  return Math.abs(BOARD.w/BOARD.h - aspect) < 0.01 && mRooms().every(l=>p.rooms[l]) ? p : null;
}
function curCal(){
  const p = presetFor();
  if(userCalOK()){ const c=BOARD.cal; return {rooms:c.rooms, doors:c.doors||{}}; }
  return p;
}
const calComplete = () => !!curCal();
function calStatus(id){
  const m = BOARD_MAPS[id], c = id===BOARD.mapId ? BOARD.cal : ((readPrefs(id)||{}).cal);
  const n = o => o ? Object.keys(o).length : 0;
  return { rooms:Math.min(n(c&&c.rooms), Object.keys(m.rooms).length), roomsOf:Object.keys(m.rooms).length,
           doors:n(c&&c.doors), doorsOf:m.doors.length };
}

// ---- lining up: rooms, then doors (where the app knows them) ----
function calSteps(){ const m=META(); return [...mRooms().map(id=>({kind:'room',id})), ...m.doors.map(id=>({kind:'door',id}))]; }
const secStart = kind => calSteps().findIndex(s=>s.kind===kind);
function stepLabel(st){
  if(st.kind==='room') return `the middle of <b>${roomName(st.id)}</b>`;
  const [a,b]=st.id.split('|'); return `the door between <b>${roomName(a)}</b> and <b>${roomName(b)}</b>`;
}
function startCalib(from){
  if(!BOARD.img) return;
  if(!BOARD.cal) BOARD.cal = {rooms:{}, doors:{}};
  BOARD.cal.doors = BOARD.cal.doors || {}; delete BOARD.cal.track;
  let i = secStart(from==='doors'?'door':'room');
  if(i<0) return;
  BOARD.calib = {i, only: from==='rooms' ? null : from};
  render();
}
function calClick(fx, fy){
  const steps = calSteps(), st = steps[BOARD.calib.i]; if(!st) return;
  const p = [+fx.toFixed(4), +fy.toFixed(4)];
  if(st.kind==='room') BOARD.cal.rooms[st.id]=p; else BOARD.cal.doors[st.id]=p;
  BOARD.cal.w = BOARD.w; BOARD.cal.h = BOARD.h;
  BOARD.calib.i++; boardPrefsSave();
  const next = steps[BOARD.calib.i];
  if(!next || (BOARD.calib.only && next.kind!==st.kind)) return finishCalib();
  render();
}
function calBack(){
  if(!BOARD.calib || BOARD.calib.i===0) return;
  const all=calSteps(); if(BOARD.calib.only && all[BOARD.calib.i-1].kind!==all[BOARD.calib.i].kind) return;
  BOARD.calib.i--; const st=calSteps()[BOARD.calib.i];
  if(st.kind==='room') delete BOARD.cal.rooms[st.id]; else delete BOARD.cal.doors[st.id];
  boardPrefsSave(); render();
}
function calSkip(){ // skip the rest of this section
  const steps=calSteps(), kind=steps[BOARD.calib.i].kind;
  let i=BOARD.calib.i; while(steps[i] && steps[i].kind===kind) i++;
  if(!steps[i] || BOARD.calib.only) return finishCalib();
  BOARD.calib.i=i; render();
}
function finishCalib(){ BOARD.calib=null; if(!BOARD.showSetup && calComplete()) BOARD.view='board'; boardPrefsSave(); render(); }
function clearPositions(){ BOARD.cal=null; boardPrefsSave(); render(); }

// ---- saving positions outside the browser ----
function exportPositions(){
  const out = {};
  for(const id of Object.keys(BOARD_MAPS)){ const c = id===BOARD.mapId ? BOARD.cal : ((readPrefs(id)||{}).cal); if(c && c.rooms && Object.keys(c.rooms).length){ const {track, ...rest} = c; out[id]=rest; } }
  return JSON.stringify(out);
}
function doExport(){
  BOARD.ioText = exportPositions();
  const n = Object.keys(JSON.parse(BOARD.ioText)).length;
  BOARD.ioMsg = n ? `Positions for ${n} map${n>1?'s':''} are in the box below.` : 'No positions saved yet.';
  try{ if(n && navigator.clipboard) navigator.clipboard.writeText(BOARD.ioText).then(()=>{ BOARD.ioMsg += ' Copied to the clipboard.'; render(); }, ()=>{}); }catch(e){}
  render();
}
function doImport(){
  const el = typeof document!=='undefined' && document.getElementById('bio'); const txt = el ? el.value : BOARD.ioText;
  let o; try{ o = JSON.parse(txt); }catch(e){ BOARD.ioMsg='That text isn\'t a positions backup.'; return render(); }
  const got = [];
  for(const id of Object.keys(BOARD_MAPS)) if(o && o[id] && o[id].rooms){ const {track, ...cal} = o[id]; try{ localStorage.setItem(bkey(id), JSON.stringify({cal})); got.push(BOARD_MAPS[id].name); }catch(e){} }
  loadCal(); BOARD.ioText = txt;
  BOARD.ioMsg = got.length ? `Loaded positions for ${got.join(', ')}.` : 'No map positions found in that text.';
  render();
}

// ---- drawing ----
const BW = 1000;
const BH = () => Math.round(BW*BOARD.h/BOARD.w);
const CC = () => BOARD.calib ? BOARD.cal : curCal();
const P2 = c => ({x:c[0]*BW, y:c[1]*BH()});
function bp(l){ return P2(CC().rooms[l]); }
function doorPt(k){ const cc=CC(), d=cc.doors && cc.doors[k]; if(d) return P2(d);
  const [a,b]=k.split('|'), A=bp(a), B=bp(b); return {x:(A.x+B.x)/2, y:(A.y+B.y)/2}; }
const BDEFS = `<defs>
  <radialGradient id="bheat"><stop offset="0" stop-color="#ff3b2a" stop-opacity=".8"/><stop offset=".55" stop-color="#c0392b" stop-opacity=".4"/><stop offset="1" stop-color="#c0392b" stop-opacity="0"/></radialGradient>
  <filter id="bsh" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity=".75"/></filter>
</defs>`;
const tok = (p, inner, extra='') => `<g transform="translate(${p.x.toFixed(1)},${p.y.toFixed(1)}) scale(${BOARD.scale})" ${extra}>${inner}</g>`;
function dotsSVG(c, cur){
  let s=''; if(!c) return s;
  const rooms=c.rooms||{}, doors=c.doors||{};
  for(const l of mRooms()){ const r=rooms[l]; if(!r) continue;
    s += tok(P2(r), `<circle r="9" fill="var(--gold)" stroke="#000" stroke-width="2"/><text x="13" y="6" font-size="18" font-weight="800" fill="#fff" stroke="#000" stroke-width="4" paint-order="stroke">${l}</text>`); }
  for(const k of META().doors){ const d=doors[k]; if(!d) continue;
    s += tok(P2(d), `<rect x="-7" y="-7" width="14" height="14" rx="2" fill="#fff" stroke="#000" stroke-width="2"/>`); }
  if(cur && cur.kind==='door') for(const l of cur.id.split('|')) if(rooms[l]) s += tok(P2(rooms[l]), `<circle r="26" fill="none" stroke="var(--blood2)" stroke-width="4" stroke-dasharray="6 5"/>`);
  return s;
}
function boardHTML(mode='game'){
  const H = BH();
  let s = `<div class="boardwrap"><span id="bimg"></span><svg class="ov" viewBox="0 0 ${BW} ${H}" preserveAspectRatio="none" ${mode==='calib'?'data-act="calclick"':''}>${BDEFS}`;
  if(mode==='calib') return s + dotsSVG(BOARD.cal, calSteps()[BOARD.calib.i]) + `</svg></div>`;
  if(mode==='preview') return s + dotsSVG(curCal() || BOARD.cal) + `</svg></div>`;
  const any = S.mind ? marg().any : null;
  const noiseSet = S.phase==='survivors' && !S.recap ? S.report.noise : S.lastNoise;
  const shownK = S.stealth ? S.visibleLoc : S.killerLoc;
  // heat map (killer's mind)
  if(any) for(const l of L){ const h=any[IX[l]]; if(h<0.02) continue;
    s += tok(bp(l), `<circle r="72" fill="url(#bheat)" opacity="${Math.min(1,0.3+h).toFixed(2)}"/>`); }
  // block tokens
  for(const k of S.blocks){ const gone = S.phase==='survivors' && S.report.removed.includes(k);
    s += tok(doorPt(k), `<g filter="url(#bsh)" opacity="${gone?0.35:1}"><rect x="-17" y="-17" width="34" height="34" rx="6" fill="#f4efe9" stroke="#b3271b" stroke-width="3.5"/><path d="M-8,-8 L8,8 M8,-8 L-8,8" stroke="#b3271b" stroke-width="5" stroke-linecap="round"/></g>`); }
  // noise tokens
  for(const l of noiseSet){ const p=bp(l);
    s += tok({x:p.x-38*BOARD.scale, y:p.y-30*BOARD.scale}, `<g filter="url(#bsh)"><path d="M0,-24 L22,14 L-22,14Z" fill="#f2c230" stroke="#3a2a00" stroke-width="3" stroke-linejoin="round"/><text y="10" font-size="24" font-weight="900" text-anchor="middle" fill="#2a1d00">!</text></g>`); }
  // the Butcher / stealth token
  if(shownK){ const p=bp(shownK);
    s += S.stealth
      ? tok(p, `<g filter="url(#bsh)"><circle r="28" fill="#2a2030" stroke="#c9a8f0" stroke-width="3.5" stroke-dasharray="6 4"/><text y="9" font-size="27" font-weight="800" text-anchor="middle" fill="#e6d4fb">?</text></g>`)
      : tok(p, `<g filter="url(#bsh)" class="killer-tok"><circle r="30" fill="#b3271b" stroke="#fff" stroke-width="4"/><text y="10" font-size="28" text-anchor="middle">🔪</text></g>`);
  }
  if(S.stealth && S.mind){ const p=bp(S.killerLoc); s += tok({x:p.x+26*BOARD.scale, y:p.y+22*BOARD.scale}, `<circle r="15" fill="var(--purple)" stroke="#fff" stroke-width="2"/><text y="5" font-size="14" text-anchor="middle">🔪</text>`); }
  // chance labels
  if(any) for(const l of L){ const h=any[IX[l]]; if(h<0.01) continue; const p=bp(l);
    s += tok({x:p.x, y:p.y+50*BOARD.scale}, `<rect x="-26" y="-14" width="52" height="25" rx="12" fill="rgba(18,10,14,.82)" stroke="#9b6bd1" stroke-width="1.5"/><text y="5" font-size="16" font-weight="800" text-anchor="middle" fill="#f3d9ff">${Math.round(h*100)}%</text>`); }
  // tap targets for marking noise
  if(S.phase==='survivors' && !S.recap) for(const l of L){ const p=bp(l);
    s += `<circle class="hit" data-node="${l}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${(58*BOARD.scale).toFixed(1)}" fill="transparent"><title>${nm(l)}</title></circle>`; }
  return s + `</svg></div>`;
}
const fileBtn = (label, cls='btn sm') => `<label class="${cls}" style="display:inline-block">${label}<input type="file" accept="image/*" data-act="boardfile" hidden></label>`;
function loaderHTML(){
  return `<div class="prompt" style="margin:0"><h3>Use your own board image</h3>
  <div class="small">Choose the ${META().name} board image from your computer, for example the Tabletop Simulator map. It's kept in this browser only. It isn't uploaded and isn't saved into the app.</div>
  <div style="margin-top:10px">${fileBtn('Choose image…','btn primary')}</div></div>`;
}
function boardTools(){
  return `<div class="row small" style="margin-top:8px">${fileBtn('Change image')}
    <button class="btn sm" data-act="bsetup">Board setup</button>
    <span class="muted">Token size</span><button class="btn sm" data-act="bscale" data-d="-0.1">−</button><b>${Math.round(BOARD.scale*100)}%</b><button class="btn sm" data-act="bscale" data-d="0.1">+</button></div>`;
}
function mapPanel(){
  const tog = `<div class="row" style="margin-bottom:8px">
    <button class="btn sm ${BOARD.view==='schematic'?'on':''}" data-act="view" data-v="schematic">Schematic</button>
    <button class="btn sm ${BOARD.view==='board'?'on':''}" data-act="view" data-v="board">Board</button>
    </div>`;
  if(BOARD.view==='board'){
    if(!BOARD.img) return tog + loaderHTML();
    if(!calComplete()) return tog + `<div class="prompt" style="margin:0"><h3>Line up the board</h3><div class="small">Click each room on your image once so the app knows where to put its tokens. It's saved in this browser, and you can back it up from Board setup.</div><div class="row" style="margin-top:10px"><button class="btn primary" data-act="calib" data-from="rooms">Start</button></div></div>`;
    return tog + `<div class="mapfit" style="--ar:${BOARD.w&&BOARD.h?(BOARD.w/BOARD.h).toFixed(4):1.63}">` + boardHTML() + `</div>` + `<div class="small muted" style="margin-top:6px">⚠ noise · ✕ block token · 🔪 the Butcher · ? stealth token${S.phase==='survivors'&&!S.recap?' · tap a room to mark noise':''}</div>` + boardTools();
  }
  return tog + `<div class="mapfit">` + mapSVG() + `</div>` + `<div class="small muted" style="margin-top:4px">Solid lines = doors · dashed green = open paths · purple = secret passages · ✕ = block token · ! = noise · 🔪 = the Butcher · ? = stealth token</div>`;
}
function survBoxes(){
  const canEdit = S.phase==='survivors' && !S.recap;
  return `<div class="sbox-row">${S.surv.map(id=>{
    const f = S.fear[id]||0, hurt = S.injured[id];
    const pip = n => canEdit
      ? `<button class="pip ${f>=n?'lit':''}" data-act="fear" data-id="${id}" data-n="${n}" title="Set ${sname(id)}'s fear (e.g. after Remove all fear, a Tranquilizer or Encouraging Words)">${n}</button>`
      : `<span class="pip ${f>=n?'lit':''}">${n}</span>`;
    return `<div class="sbox"><div class="sn" title="${SV[id].name}"><span class="nfull">${SV[id].name}</span><span class="nfirst">${sname(id)}</span>${id==='dylan'&&!S.toughUsed?'<span class="tough" title="Toughness token: avoids the first damage"><span class="nfull">Tough</span><span class="nfirst">🛡</span></span>':''}</div>
      ${canEdit && tileSnap().injured[id]
        ? `<button class="hpbig ${hurt?'hurt':'ok'}" data-act="heal" data-id="${id}" title="${hurt?`Click if ${sname(id)} was healed this turn`:'Healed this turn. Click to undo'}">${hurt?'Hurt':'OK · healed'}</button>`
        : `<span class="hpbig ${hurt?'hurt':'ok'}">${hurt?'Hurt':'OK'}</span>`}
      <div class="fearrow"><span class="fl">Fear</span>${pip(1)}${pip(2)}<span class="pip nz ${f>=2?'warn':''}" title="A 3rd fear overwhelms: noise instead">⚠</span></div></div>`;
  }).join('')}</div>`;
}
function killerBox(){
  const lvTxt = S.level>1 ? BUTCHER.levels[S.level] : 'No level bonus yet';
  const base = Math.min(10, S.baseStr), enc = strength();
  const bits = [];
  bits.push(`<div class="kname"><i>🔪</i>The ${BUTCHER.name}</div>`);
  bits.push(`<div class="kstat"><small>Level</small><b>${S.level}</b><em>${lvTxt}</em></div>`);
  bits.push(`<div class="kstat"><small>Strength</small><b>${base}</b></div>`);
  if(S.tempStr) bits.push(`<div class="kstat enc" title="Strength used in encounters this turn"><small>Encounter strength</small><b>${enc}</b><em>${(S.tempWhy&&S.tempWhy.length?S.tempWhy.join(', '):'+'+S.tempStr)} this turn</em></div>`);
  if(S.stealth) bits.push(`<div class="kstat st"><small>Status</small><b style="font-size:15px;color:#d9c3f5">In stealth</b><em>Last seen in ${nm(S.visibleLoc)}</em></div>`);
  let mini = '';
  for(let i=S.log.length-1;i>=0;i--){ if(/Butcher's turn/.test(S.log[i].head)){ mini = S.log[i]; break; } }
  const mh = !mini ? 'His turn' : S.phase==='killer' && mini===S.log[S.log.length-1] ? 'This turn' : 'His last turn' + (mini.head.match(/Round \d+/)?` (${mini.head.match(/Round \d+/)[0]})`:'');
  const lines = mini ? mini.lines.map(l=>`<div class="l ${l.kind}">${l.text}</div>`).join('') : '<div class="l info">He hasn\'t taken a turn yet.</div>';
  return `<div class="kbox"><div class="kstats">${bits.join('')}</div><div class="minilog" id="minilog"><div class="mh">${mh}</div>${lines}</div></div>`;
}
function calibHTML(){
  const steps=calSteps(), i=BOARD.calib.i, st=steps[i];
  const secs = {room:'Room', door:'Door'};
  const inSec = steps.filter(s=>s.kind===st.kind), k = i - secStart(st.kind);
  const help = st.kind==='room' ? 'Click the middle of each room. The Butcher, noise and heat markers are drawn there.'
    : 'Click each door so block tokens sit right on it. Doors are optional: skipped ones go halfway between the two rooms.';
  return `<main style="grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);grid-template-areas:'map side';max-width:none">
  <div class="a-map card calib" style="padding:8px">${boardHTML('calib')}</div>
  <div class="a-side card"><h2>Line up ${META().name}</h2>
    <div class="small muted">${help}</div>
    <div class="prompt"><h3>${secs[st.kind]} ${k+1} of ${inSec.length}</h3><div>Click ${stepLabel(st)}.</div></div>
    <div class="row" style="margin-top:12px">
      ${i>0?'<button class="btn" data-act="calback">↶ Back</button>':''}
      ${st.kind!=='room'?`<button class="btn primary" data-act="calskip">Skip the doors</button>`:''}
      <button class="btn ghost" data-act="calcancel">${userCalOK()?'Done':'Stop here'}</button>
    </div>
    <div class="small muted" style="margin-top:10px">Every click is saved as you go.</div></div></main>`;
}
function boardSetupHTML(){

    <h3>All maps</h3>

    <div class="row" style="margin-top:12px"><button class="btn primary" data-act="bsetupclose">Done</button></div>

}

}

/* ============================================================
   RENDER
   ============================================================ */
const zc = z => z==='B'?'var(--blue)':z==='R'?'var(--red)':'var(--green)';
function mapSVG(){
  const clickable = S.phase==='survivors' && !S.recap;

function turnHTML(mode){ const live = mode==='live';

  if(!live){
    if(sm.skipped) rows.push(['Turn','Skipped (Lie in Wait)']);

      if(sm.stealthStart) rows.push(['Reappeared', `in <b>${nm(sm.start)}</b>`]);
      if(sm.path.length) rows.push(['Moved', [sm.start, ...sm.path].map(l=>`<b>${l}</b> ${MAP.locs[l].n}`).join(' → ')]);

      if(sm.blocks.length) rows.push(['Blocks placed', sm.blocks.map(k=>{ const [a,b]=k.split('|'); return `${a} ${MAP.locs[a].n} ↔ ${b} ${MAP.locs[b].n}`; }).join('<br>')]);

    `Survivors: ${S.surv.map(id=>SV[id].name).join(', ')} · ${diffLabel(S)}${S.traits&&S.traits.length?' · traits: '+S.traits.map(t=>TRAITS[t].name).join(', '):''}`,
    `Status: ${S.phase==='over'?(S.winner==='killer'?'Butcher won':'Survivors won')+' after '+S.round+' rounds':'in progress, round '+S.round}`, ''];
  for(const t of S.log){ out.push('## '+t.head); t.lines.forEach(l=>out.push('- '+plain(l.text))); (t.why||[]).forEach(w=>out.push('  · why: '+plain(w))); out.push(''); }
  return out.join('\n');
}
function reportBoxHTML(){ return REPORT===null ? '' : `<div style="margin-top:10px;text-align:left"><div class="small">${REPORT.copied?'Copied to the clipboard. ':''}Paste this to Claude to review the killer's decisions. It shows his hand and reasoning, so it's full of spoilers.</div><textarea readonly spellcheck="false" style="width:100%;height:140px;margin-top:6px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;font:12px monospace">${REPORT.text.replace(/</g,'&lt;')}</textarea><div class="row"><button class="btn sm ghost" data-act="greportclose">Close</button></div></div>`; }
let SAVED_CACHE;
function render(){
  const app = document.getElementById('app');
  { const bs = boardScreenHTML(); if(bs){ app.innerHTML = `<header><h1>TERRORSCAPE · Solo Killer</h1></header>` + bs; placeBoardImg(); return; } }
  if(!S){ app.innerHTML = `<header><h1>TERRORSCAPE · Solo Killer</h1><span class="spacer"></span><button class="btn sm ghost gear ${SETUP.gear?'on':''}" data-act="gear" title="Settings: killer&#39;s mind and board images" aria-label="Settings">⚙</button></header>` + setupHTML(SAVED_CACHE); return; }
  const head = `<header><h1>TERRORSCAPE · Solo Killer</h1>
    <div class="hbox ${S.phase==='killer'||S.recap?'kturn':''}"><small>Round</small><b>${S.phase==='killer'||!S.recap?S.round:S.round-1}</b><small class="who">${S.phase==='over'?'Game over':S.phase==='killer'||S.recap?'Butcher':'Survivors'}</small></div>${survBoxes()}${S.rescue&&rescueLeft()!==null&&S.phase!=='over'?`<div class="hbox gold"><small>Rescue in</small><b>${rescueLeft()}</b></div>`:''}<span class="spacer"></span>
    <button class="btn sm ghost gear ${GMENU?'on':''}" data-act="gmenu" title="Settings" aria-label="Settings">⚙</button>
    ${GMENU?`<div class="gmenu"><button class="btn sm ${S.mind?'on':''}" data-act="mindtoggle">👁 ${S.mind?'Hide':'Show'} the killer's mind <span class="muted">(spoilers)</span></button>
      <button class="btn sm" data-act="bsetup">Board setup</button>
      <button class="btn sm" data-act="greport">Copy game report <span class="muted">(spoilers: for sending to Claude)</span></button>
      <button class="btn sm" data-act="quit">Leave this game <span class="muted">(it stays saved; resume it from the new-game screen)</span></button><div class="small muted" style="text-align:right">${APP_VERSION}</div></div>`:''}</header>`;
  let side;
  if(S.phase==='over'){
    side = `<div class="card over"><h2 style="color:${S.winner==='killer'?'var(--blood2)':'var(--green)'}">${S.winner==='killer'?'The Butcher wins.':'The survivors escape!'}</h2><div class="muted">Game over after ${S.round} round${S.round>1?'s':''}.</div><div class="row" style="justify-content:center;margin-top:14px"><button class="btn primary" data-act="quit">New game</button><button class="btn" data-act="greport">Copy game report</button></div>${reportBoxHTML()}</div>${lastKillerTurn()?`<div style="margin-top:14px">${turnHTML('over')}</div>`:''}`;
  } else if(S.phase==='survivors' && S.recap && lastKillerTurn()){
    side = turnHTML('recap');
  } else if(S.phase==='survivors'){
    side = `<div class="card">${reportHTML()}</div>`;
  } else {
    side = turnHTML('live') || `<div class="card"><h2>The Butcher's turn</h2>${promptHTML()}</div>`;
  }
  const traitsCard = (S.traits&&S.traits.length) ? `<details class="card" style="margin-bottom:14px"><summary style="cursor:pointer"><b style="color:var(--purple)">Butcher's traits</b> <span class="small muted">(${diffLabel(S)} — public, tap to read)</span>: ${S.traits.map(t=>TRAITS[t].name).join(', ')}</summary>${S.traits.map(t=>`<div class="small" style="margin-top:8px"><b>${TRAITS[t].name}</b> — ${TRAITS[t].text}</div>`).join('')}</details>` : '';
  app.innerHTML = head + `<main><div class="a-map card game" style="padding:8px">${mapPanel()}${killerBox()}</div>
    <div class="a-side">${REPORT!==null && S.phase!=='over' ? `<div class="card" style="margin-bottom:14px">${reportBoxHTML()}</div>` : ''}${traitsCard}${side}${S.mind?`<div class="a-mind">${mindHTML()}</div>`:''}<div class="card" style="margin-top:14px"><h2>Log</h2><div class="log">${logHTML()}</div></div></div></main>`;
  placeBoardImg(); setHdr();
  { const ml=document.getElementById('minilog'); if(ml && ml.scrollHeight!==undefined) ml.scrollTop = S.phase==='killer' ? ml.scrollHeight : 0; }
  if(PROMPT && window.innerWidth<1400){ const el=document.querySelector('.turnbox .prompt')||document.querySelector('.prompt'); if(el && el.scrollIntoView) el.scrollIntoView({block:'nearest', behavior:'smooth'}); }
  if(SCROLL_TURN){ SCROLL_TURN=false; const el=document.querySelector('.turnbox'); if(el && el.scrollIntoView) el.scrollIntoView({block:'start', behavior:'smooth'}); }
}

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act],[data-node]'); if(!el) return;
  if(el.dataset.node && !el.dataset.act){ if(S && S.phase==='survivors' && !S.recap){ toggleNoise(el.dataset.node); } return; }
  const a = el.dataset.act;
  // board image view
  if(a==='view'){ BOARD.view=el.dataset.v; boardPrefsSave(); return render(); }
  if(a==='stream'){ BOARD.stream=!BOARD.stream; applyStream(); boardPrefsSave(); return render(); }
  if(a==='calib'){ return startCalib(el.dataset.from); }
  if(a==='calclick'){ const r=el.getBoundingClientRect(); return calClick((e.clientX-r.left)/r.width, (e.clientY-r.top)/r.height); }
  if(a==='calback'){ return calBack(); }
  if(a==='calskip'){ return calSkip(); }
  if(a==='calcancel'){ return finishCalib(); }
  if(a==='bsetup'){ GMENU=false; BOARD.showSetup=true; BOARD.ioMsg=''; return render(); }
  if(a==='bsetupclose'){ BOARD.showSetup=false; return setBoardMap(MAP.id); }
  if(a==='bmap'){ return setBoardMap(el.dataset.m); }
  if(a==='bclear'){ return clearPositions(); }
  if(a==='bexport'){ return doExport(); }
  if(a==='bimport'){ return doImport(); }
  if(a==='bscale'){ BOARD.scale=Math.max(0.5, Math.min(2.5, +(BOARD.scale + +el.dataset.d).toFixed(2))); boardPrefsSave(); return render(); }
  if(a==='bremove'){ return removeBoard(); }
  if(a==='bpreset'){ BOARD.cal=null; boardPrefsSave(); return render(); }
  if(a==='boardfile'){ return; }
  // setup
  if(a==='pick'){ const id=el.dataset.id; if(SETUP.surv.includes(id)) SETUP.surv=SETUP.surv.filter(x=>x!==id); else if(SETUP.surv.length<3) SETUP.surv.push(id); return render(); }
  if(a==='diff'){ SETUP.diff=el.dataset.k; return render(); }
  if(a==='traits'){ SETUP.traits = !SETUP.traits; if(SETUP.diff==='vanilla') SETUP.diff='normal'; return render(); }
  if(a==='map'){ const m=SETUP_MAPS.find(x=>x.id===el.dataset.id); if(m.ready){ SETUP.map=m.id; SETUP.peek=null; } else SETUP.peek = SETUP.peek===m.id ? null : m.id; return render(); }
  if(a==='killer'){ SETUP.killer=el.dataset.id; return render(); }
  if(a==='gear'){ SETUP.gear=!SETUP.gear; return render(); }
  if(a==='skill'){ SETUP.skill=el.dataset.k; return render(); }
  if(a==='start'){ if(SETUP.surv.length===3) newGame(SETUP.surv, SETUP.traits?SETUP.diff:'vanilla', SETUP.mind, SETUP.traits?'normal':SETUP.skill); return; }
  if(a==='resume'){ S=SAVED_CACHE; HISTORY=[]; REPORT=null; return render(); }
  if(a==='discard-save'){ clearSave(); SAVED_CACHE=null; return render(); }
  if(a==='quit'){ ENDASK=null; REPORT=null; GMENU=false; S=null; PROMPT=null; SAVED_CACHE=loadSaved(); if(SAVED_CACHE && SAVED_CACHE.phase==='over') { clearSave(); SAVED_CACHE=null; } return render(); }
  if(a==='gmenu'){ GMENU=!GMENU; return render(); }
  if(a==='recapdone'){ S.recap=false; save(); window.scrollTo && window.scrollTo(0,0); return render(); }
  if(a==='greport'){ GMENU=false; const text=gameReport(); REPORT={text, copied:false};
    try{ navigator.clipboard.writeText(text).then(()=>{ if(REPORT) REPORT.copied=true; render(); }, ()=>{}); }catch(err){}
    return render(); }
  if(a==='greportclose'){ REPORT=null; return render(); }
  if(a==='mindtoggle'){ S.mind=!S.mind; GMENU=false; return render(); }
  // report
  if(a==='noise'){ toggleNoise(el.dataset.l); return; }
  if(a==='rmblock'){ const k=el.dataset.k, r=S.report; r.removed = r.removed.includes(k)? r.removed.filter(x=>x!==k) : [...r.removed,k]; return render(); }
  if(a==='keys'){ S.keys = Math.max(0, Math.min(5, S.keys + (+el.dataset.d))); return render(); }
  if(a==='submit'){ return submitReport(); }
  if(a==='undo'){ ENDASK=null; if(HISTORY.length){ S = deserialize(HISTORY.pop()); PROMPT=null; save(); render(); } return; }
  if(a==='endask'){ ENDASK = el.dataset.v || null; return render(); }
  if(a==='win-s-escape'){ ENDASK=null; logTurn('Game over'); say(`All three survivors escape with the 5 keys.`,'do'); return gameOver('survivors'); }
  if(a==='heal'){ if(S.phase!=='survivors' || S.recap) return; const id=el.dataset.id; if(tileSnap().injured[id]) S.injured[id]=!S.injured[id]; return render(); }
  if(a==='fear'){ if(S.phase!=='survivors' || S.recap) return; const id=el.dataset.id, n=+el.dataset.n, f=S.fear[id]||0; S.fear[id] = f===n ? n-1 : n; return render(); }
  if(a==='rescueadj'){ const d=+el.dataset.d, v=rescueLeft()+d; if(v>=1 && v<=5){ S.rescueRound += d; } return render(); }
  if(a==='win-s'){ ENDASK=null; logTurn('Game over'); say('The survivors won.','info'); return gameOver('survivors'); }
  if(a==='win-k'){ ENDASK=null; logTurn('Game over'); say('The Butcher won.','info'); return gameOver('killer'); }
  // prompts
  const P = PROMPT; if(!P) return;
  if(a==='choice'){ const v=P.options[+el.dataset.i].value; PROMPT=null; P.resolve(v); return; }
  if(a==='msel'){ const v=el.dataset.v; P.sel = P.sel.includes(v)? P.sel.filter(x=>x!==v) : [...P.sel,v]; return render(); }
  if(a==='mconfirm'){ const v=P.sel.slice(); PROMPT=null; P.resolve(v); return; }
  if(a==='rsel'){ P.vals[el.dataset.id]=el.dataset.v; return render(); }
  if(a==='rconfirm'){ const out={}; P.items.forEach(it=>out[it.value]=P.vals[it.value]||P.def); PROMPT=null; P.resolve(out); return; }
});
document.addEventListener('change', e=>{
  const a = e.target.dataset.act;
  if(a==='fc'){ S.report.firecracker = e.target.checked; if(S.report.firecracker) S.report.noise=[]; render(); }
  if(a==='rescue'){ S.rescue = e.target.checked; S.rescueRound = S.rescue ? S.round : null; render(); }
  if(a==='mind'){ SETUP.mind = e.target.checked; }
  if(a==='boardfile'){ const f = e.target.files && e.target.files[0]; e.target.value=''; loadBoardFile(f); }
});
function toggleNoise(l){ const r=S.report; if(r.firecracker) return; r.noise = r.noise.includes(l)? r.noise.filter(x=>x!==l) : [...r.noise,l]; render(); }

SAVED_CACHE = loadSaved();
if(SAVED_CACHE && SAVED_CACHE.phase==='over'){ SAVED_CACHE=null; }
render();
boardInit();
</script>

</html>
